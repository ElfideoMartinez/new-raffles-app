<!doctype html>
<!--
  Story template — TRIVIA / BIG STAT — 1080x1920 (9:16).
  Giant stat number with context paragraph and optional fighter photo.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #f5f0e8;
    background:
      radial-gradient(1100px 900px at 88% -6%, rgba(216,64,64,.55), transparent 62%),
      radial-gradient(900px 700px at -8% 106%, rgba(255,122,24,.32), transparent 55%),
      linear-gradient(165deg, #12100e 0%, #1c1512 55%, #0d0b0a 100%);
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 90px 72px 100px;
  }
  .kicker {
    font-size: 32px; letter-spacing: .28em; text-transform: uppercase;
    color: #ffb347; font-weight: 700;
  }
  .headline {
    margin-top: 50px; font-size: 180px; font-weight: 900; line-height: .92;
    background: linear-gradient(180deg, #ffe2a6 0%, #ffb347 55%, #c77a1d 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none;
  }
  .sub {
    margin-top: 18px; font-size: 44px; font-weight: 800; line-height: 1.15;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .context {
    margin-top: 30px; font-size: 30px; font-weight: 500; line-height: 1.45;
    color: rgba(245,240,232,.78); max-width: 880px;
  }
  .lines {
    margin-top: 28px; display: flex; flex-direction: column; gap: 14px;
    width: 100%;
  }
  .line-item {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,179,71,.3);
    border-radius: 12px; padding: 18px 28px;
    font-size: 28px; font-weight: 600; line-height: 1.3;
  }
  .photo-box {
    margin-top: 32px; width: 400px; height: 360px; border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(160deg, rgba(216,64,64,.30), rgba(255,122,24,.15));
    border: 1px solid rgba(255,179,71,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .photo-box img { max-width: 100%; max-height: 100%; width: auto; height: auto; }
  .source {
    margin-top: 22px; font-size: 20px; font-weight: 600;
    letter-spacing: .06em; color: rgba(245,240,232,.45); font-style: italic;
  }
  .spacer { flex: 1; }
  .cta {
    background: #f5f0e8; color: #12100e; font-size: 42px; font-weight: 900;
    text-transform: uppercase; letter-spacing: .06em;
    padding: 26px 56px; border-radius: 999px;
  }
  .brand {
    margin-top: 32px; font-size: 30px; color: rgba(245,240,232,.65);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="kicker">{{event.kicker}}</div>
  <div class="headline">{{story.headline}}</div>
  <div class="sub">{{story.sub}}</div>
  <div class="context">{{story.context}}</div>
  <div class="lines">
    {{#each story.lines}}<div class="line-item">{{text}}</div>{{/each}}
  </div>
  {{#if fighter.photoDataUri}}<div class="photo-box"><img src="{{{fighter.photoDataUri}}}" alt="fighter"></div>{{/if}}
  {{#unless fighter.photoDataUri}}<div class="spacer"></div>{{/unless}}
  <div class="source">{{story.source}}</div>
  <div class="spacer"></div>
  <div class="cta">{{cta}}</div>
  <div class="brand">{{brand.name}} · {{brand.handle}}</div>
</body>
</html>
