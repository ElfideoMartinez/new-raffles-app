<!doctype html>
<!--
  Feed template — 1080x1350 (4:5). Rendered by scripts/instagram/generate.mjs.
  All tokens use double-brace syntax: {{brand.name}} etc. See README.md for schema.
  Self-contained: no external fonts, images or network assets.
-->
<html lang="{{locale}}">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #f5f0e8;
    background:
      radial-gradient(900px 700px at 85% -10%, rgba(216,64,64,.55), transparent 60%),
      radial-gradient(800px 600px at -10% 110%, rgba(255,122,24,.35), transparent 55%),
      linear-gradient(160deg, #12100e 0%, #1c1512 55%, #0d0b0a 100%);
    display: flex; flex-direction: column;
    padding: 72px 80px 64px;
  }
  .kicker {
    font-size: 30px; letter-spacing: .28em; text-transform: uppercase;
    color: #ffb347; font-weight: 700;
  }
  .title {
    font-size: 168px; font-weight: 900; line-height: .95;
    letter-spacing: -.01em; margin-top: 14px;
    text-transform: uppercase;
  }
  .subtitle {
    font-size: 58px; font-weight: 800; color: #ff4d3d;
    margin-top: 10px; text-transform: uppercase; letter-spacing: .02em;
  }
  .banner {
    margin-top: 42px; padding: 18px 28px; display: inline-block;
    background: #f5f0e8; color: #12100e; font-weight: 900;
    font-size: 34px; letter-spacing: .12em; text-transform: uppercase;
    align-self: flex-start; border-radius: 6px;
  }
  .card {
    margin-top: 44px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,179,71,.35); border-radius: 18px;
    padding: 40px 44px; flex: 1; display: flex; flex-direction: column; gap: 26px;
  }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .row .label {
    font-size: 24px; letter-spacing: .22em; text-transform: uppercase;
    color: #ffb347; font-weight: 700;
  }
  .row .value { font-size: 38px; font-weight: 700; line-height: 1.25; }
  .body {
    margin-top: 38px; font-size: 32px; line-height: 1.45;
    color: rgba(245,240,232,.85);
  }
  .footer {
    margin-top: auto; display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px solid rgba(245,240,232,.2); padding-top: 30px;
  }
  .cta { font-size: 34px; font-weight: 900; color: #ffb347; text-transform: uppercase; letter-spacing: .06em; }
  .brand { font-size: 26px; color: rgba(245,240,232,.7); font-weight: 600; }
</style>
</head>
<body>
  <div class="kicker">{{event.kicker}}</div>
  <div class="title">{{event.title}}</div>
  <div class="subtitle">{{event.subtitle}}</div>
  <div class="banner">{{banner}}</div>
  <div class="card">
    {{#each highlights}}<div class="row">
      <div class="label">{{label}}</div>
      <div class="value">{{value}}</div>
    </div>{{/each}}
  </div>
  <div class="body">{{body}}</div>
  <div class="footer">
    <div class="cta">{{cta}} ⬆</div>
    <div class="brand">{{brand.name}} · {{brand.handle}}</div>
  </div>
</body>
</html>
