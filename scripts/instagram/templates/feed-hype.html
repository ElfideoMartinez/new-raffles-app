<!doctype html>
<!--
  Feed template — HYPE / HISTORY — 1080x1350 (4:5). Rendered by scripts/instagram/generate.mjs.
  Self-contained: no external fonts, images or network assets.
  Left column = fighter portrait (embedded local file, data URI) or initials fallback.
-->
<html lang="{{locale}}">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #f5f0e8;
    background:
      radial-gradient(1000px 800px at 95% -8%, rgba(216,64,64,.55), transparent 60%),
      radial-gradient(800px 600px at -10% 110%, rgba(255,122,24,.32), transparent 55%),
      linear-gradient(160deg, #12100e 0%, #1c1512 55%, #0d0b0a 100%);
    display: flex; flex-direction: column;
    padding: 76px 80px 64px;
  }
  .kicker {
    font-size: 30px; letter-spacing: .28em; text-transform: uppercase;
    color: #ffb347; font-weight: 700;
  }
  .recipe { display: flex; gap: 44px; margin-top: 40px; flex: 1; }
  .portrait {
    position: relative;
    width: 400px; flex: 0 0 400px; border-radius: 20px; overflow: hidden;
    background: linear-gradient(160deg, rgba(216,64,64,.35), rgba(255,122,24,.18));
    border: 1px solid rgba(255,179,71,.4);
    display: flex; align-items: center; justify-content: center;
  }
  .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .initials { font-size: 150px; font-weight: 900; color: rgba(245,240,232,.75); letter-spacing: -.02em; }
  .facts { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 26px; }
  .name { font-size: 76px; font-weight: 900; line-height: .98; text-transform: uppercase; }
  .nick { font-size: 34px; font-weight: 700; color: #ff4d3d; letter-spacing: .06em; text-transform: uppercase; }
  .statline { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 6px; }
  .stat { background: rgba(255,255,255,.06); border: 1px solid rgba(255,179,71,.35); border-radius: 14px; padding: 16px 22px; }
  .stat b { display: block; font-size: 40px; font-weight: 900; }
  .stat span { font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: #ffb347; }
  .factlist { display: flex; flex-direction: column; gap: 16px; margin-top: 6px; }
  .fact { font-size: 28px; line-height: 1.35; color: rgba(245,240,232,.9); }
  .fact::before { content: "— "; color: #ffb347; font-weight: 900; }
  .footer {
    margin-top: auto; display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px solid rgba(245,240,232,.2); padding-top: 28px;
  }
  .cta { font-size: 32px; font-weight: 900; color: #ffb347; text-transform: uppercase; letter-spacing: .06em; }
  .brand { font-size: 26px; color: rgba(245,240,232,.7); font-weight: 600; }
</style>
</head>
<body>
  <div class="kicker">{{event.kicker}}</div>
  <div class="recipe">
    <div class="portrait">
      <div class="initials">{{fighter.initials}}</div>
      {{#if fighter.photoDataUri}}<img src="{{fighter.photoDataUri}}" alt="{{fighter.name}}" onerror="this.remove()">{{/if}}
    </div>
    <div class="facts">
      <div class="name">{{fighter.name}}</div>
      <div class="nick">{{fighter.nickname}}</div>
      <div class="statline">
        {{#each fighter.stats}}<div class="stat"><b>{{value}}</b><span>{{label}}</span></div>{{/each}}
      </div>
      <div class="factlist">
        {{#each fighter.facts}}<div class="fact">{{this}}</div>{{/each}}
      </div>
    </div>
  </div>
  <div class="footer">
    <div class="cta">{{cta}}</div>
    <div class="brand">{{brand.name}} · {{brand.handle}}</div>
  </div>
</body>
</html>
