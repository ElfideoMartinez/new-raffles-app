<!doctype html><html lang="es"><head><meta charset="utf-8"><style>*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}body{font-family:"Helvetica Neue",Arial,sans-serif;background:radial-gradient(ellipse at top right,#26374b,transparent 70%),#100f13;color:#fff6e9}.kicker{position:absolute;top:250px;left:80px;right:80px;font-size:26px;letter-spacing:4px;color:#ffc766}.headline{position:absolute;top:330px;left:80px;right:80px;font-size:88px;line-height:1.02;font-weight:900;overflow-wrap:anywhere}.sub{position:absolute;top:550px;left:80px;right:80px;font-size:44px;line-height:1.14;font-weight:800}.context{position:absolute;top:760px;left:80px;right:80px;font-size:33px;line-height:1.4;color:#ded0bf}.lines{position:absolute;top:995px;left:80px;right:80px;font-size:29px;line-height:1.4}.line{margin-bottom:12px}.source{position:absolute;top:1230px;left:80px;right:80px;font-size:19px;color:#a79b91}.prompt{position:absolute;top:1292px;left:80px;right:80px;font-size:32px;font-weight:800}.sticker-space{position:absolute;left:140px;top:1380px;width:800px;height:230px;background:#100f13}.brand{position:absolute;top:1638px;left:80px;right:80px;font-size:24px;color:#b6aca2}</style></head><body><div class="kicker">{{event.kicker}}</div><h1 class="headline">{{story.headline}}</h1><div class="sub">{{story.sub}}</div><div class="context">{{story.context}}</div><div class="lines">{{#each story.lines}}<div class="line">{{text}}{{label}} {{value}}</div>{{/each}}</div><div class="source">{{story.source}}</div><div class="prompt">{{story.prompt}}</div><div class="sticker-space" aria-hidden="true"></div><div class="brand">{{brand.handle}} · {{brand.name}}</div></body></html>
