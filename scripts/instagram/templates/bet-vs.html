<!doctype html><html lang="es"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{width:1080px;height:1350px;margin:0;padding:68px 52px 52px;background:radial-gradient(circle at 50% 36%,#302018,#0c111b 72%);color:#f8fafc;font:28px/1.25 Arial,sans-serif;display:flex;flex-direction:column}.eyebrow{color:#ffae72;font-size:25px;text-transform:uppercase;letter-spacing:.18em}.event{font-size:47px;font-weight:900;margin:24px 0 56px;line-height:1.1;min-height:105px}.pair{display:grid;grid-template-columns:1fr 94px 1fr;gap:16px;align-items:center;flex:1}.fighter{min-width:0;text-align:center}.photo{height:560px;display:flex;justify-content:center;align-items:flex-end;background:linear-gradient(180deg,#25222b,#152032);border:1px solid #604537;border-radius:22px;overflow:hidden}.photo img{max-height:100%;max-width:100%;object-fit:contain}.missing{font-size:24px;color:#cbd5e1;padding:25px}.name{font-size:39px;font-weight:900;overflow-wrap:anywhere;text-transform:uppercase;min-height:110px;margin-top:25px}.record{font-size:27px;color:#fbbf24;margin-top:14px}.vs{font-size:48px;font-weight:900;text-align:center;color:#ff8c4e}.footer{border-top:1px solid #586172;padding-top:30px;margin-top:48px;color:#cbd5e1;font-size:26px;display:flex;justify-content:space-between}</style></head><body><div class="eyebrow">Rifas Mtz · vista previa de apuesta</div><div class="event">{{EVENT}}</div><div class="pair"><div class="fighter"><div class="photo">{{PHOTO_A}}</div><div class="name">{{A}}</div><div class="record">{{RECORD_A}}</div></div><div class="vs">VS</div><div class="fighter"><div class="photo">{{PHOTO_B}}</div><div class="name">{{B}}</div><div class="record">{{RECORD_B}}</div></div></div><div class="footer"><span>{{DATE}}</span><span>Datos sujetos a revisión</span></div></body></html>
