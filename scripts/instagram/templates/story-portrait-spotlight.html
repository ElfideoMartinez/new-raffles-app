<!doctype html>
<html lang="es"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}body{font-family:"Helvetica Neue",Arial,sans-serif;color:#fff6e9;background:radial-gradient(ellipse at 70% 40%,#544122,transparent 65%),#100f13}.kicker{position:absolute;top:250px;left:80px;font-size:26px;color:#ffc766;letter-spacing:4px}.name{position:absolute;top:330px;left:80px;right:80px;font-size:70px;line-height:1.05;font-weight:900;overflow-wrap:anywhere}.portrait{position:absolute;top:520px;left:420px;width:540px;height:690px;display:flex;align-items:flex-end;justify-content:center}.portrait img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.stat{position:absolute;top:610px;left:80px;font-size:180px;font-weight:900;line-height:1;color:#ffc766}.stat-label{position:absolute;top:810px;left:80px;width:300px;font-size:29px;line-height:1.3}.record{position:absolute;top:1080px;left:80px;font-size:37px;font-weight:800}.prompt{position:absolute;top:1292px;left:80px;right:80px;font-size:33px;font-weight:800}.sticker-space{position:absolute;left:140px;top:1380px;width:800px;height:230px;background:#100f13}.brand{position:absolute;top:1638px;left:80px;font-size:24px;color:#b6aca2}
</style></head><body><div class="kicker">EN EL FOCO · UFC</div><h1 class="name">{{fighter.name}}</h1><div class="portrait">{{#if fighter.photoDataUri}}<img src="{{{fighter.photoDataUri}}}" alt="{{fighter.name}}">{{/if}}{{#unless fighter.photoDataUri}}<span>{{fighter.initials}}</span>{{/unless}}</div><div class="stat">{{story.headline}}</div><div class="stat-label">Victorias profesionales de MMA, no solo UFC.</div><div class="record">{{fighter.record}}<br>W-L-D</div><div class="prompt">{{story.prompt}}</div><div class="sticker-space" aria-hidden="true"></div><div class="brand">{{brand.handle}} · {{brand.name}}</div></body></html>
