<!doctype html>
<!--
  Feed template — FUN FACT / TRIVIA — 1080x1350 (4:5).
  "¿Sabías que…?" card with icon+text fact rows. No fighter photo needed.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #f5f0e8;
    background:
      radial-gradient(900px 700px at 8% -8%, rgba(216,64,64,.55), transparent 62%),
      radial-gradient(900px 700px at 92% 108%, rgba(255,122,24,.42), transparent 62%),
      linear-gradient(160deg, #0d0b0a 0%, #1c1512 55%, #0d0b0a 100%);
    display: flex; flex-direction: column;
    padding: 64px 56px 48px;
  }
  .kicker {
    font-size: 28px; letter-spacing: .28em; text-transform: uppercase;
    color: #ffb347; font-weight: 700; text-align: center;
  }
  .heading {
    margin-top: 42px; text-align: center; font-size: 72px; font-weight: 900;
    line-height: 1.08; text-transform: uppercase;
    background: linear-gradient(180deg, #ffe2a6 0%, #ffb347 55%, #c77a1d 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .items {
    margin-top: 44px; display: flex; flex-direction: column; gap: 20px;
    flex: 1;
  }
  .item {
    display: flex; align-items: flex-start; gap: 22px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,179,71,.3);
    border-radius: 16px; padding: 26px 30px;
  }
  .item-icon { font-size: 40px; flex: 0 0 48px; text-align: center; line-height: 1.2; }
  .item-text { font-size: 30px; font-weight: 600; line-height: 1.35; }
  .source {
    margin-top: 24px; text-align: right; font-size: 20px;
    font-weight: 600; letter-spacing: .06em;
    color: rgba(245,240,232,.45); font-style: italic;
  }
  .footer {
    margin-top: 24px; display: flex; justify-content: space-between;
    align-items: baseline; border-top: 1px solid rgba(245,240,232,.2);
    padding-top: 22px;
  }
  .cta {
    font-size: 32px; font-weight: 900; color: #ffb347;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .brand { font-size: 24px; color: rgba(245,240,232,.7); font-weight: 600; }
</style>
</head>
<body>
  <div class="kicker">{{event.kicker}}</div>
  <div class="heading">{{funfact.heading}}</div>
  <div class="items">
    {{#each funfact.items}}<div class="item"><div class="item-icon">{{icon}}</div><div class="item-text">{{text}}</div></div>{{/each}}
  </div>
  <div class="source">{{funfact.source}}</div>
  <div class="footer">
    <div class="cta">{{cta}}</div>
    <div class="brand">{{brand.name}} · {{brand.handle}}</div>
  </div>
</body>
</html>
