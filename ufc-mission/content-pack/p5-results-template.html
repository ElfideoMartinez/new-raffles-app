<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; }
  .stage {
    position: relative; width: 1080px; height: 1350px;
    background: url('file:///Users/danielmartinez/.openclaw/media/tool-image-generation/p4-story-bg---cb5c9a15-a9fe-4228-bdef-f66d465b4c7b.jpg') center/cover no-repeat;
    font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
  }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.25) 30%, rgba(0,0,0,.80) 60%, rgba(0,0,0,.92) 100%);
  }
  .kicker {
    position: absolute; top: 60px; left: 0; right: 0; text-align: center;
    font-size: 32px; letter-spacing: 10px; color: #f5c542; font-weight: 900;
    text-shadow: 0 2px 12px rgba(0,0,0,.85);
  }
  .title {
    position: absolute; top: 110px; left: 0; right: 0; text-align: center;
    font-size: 100px; font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 4px 26px rgba(0,0,0,.95);
  }
  .panel {
    position: absolute; top: 430px; left: 80px; right: 80px;
    background: rgba(0,0,0,.66); border: 2px solid #f5c542; border-radius: 24px;
    padding: 50px 40px;
  }
  .row { margin-bottom: 40px; }
  .row:last-child { margin-bottom: 0; }
  .label {
    font-size: 30px; color: #f5c542; font-weight: 900; letter-spacing: 4px;
    margin-bottom: 14px; text-transform: uppercase;
  }
  .value {
    font-size: 52px; font-weight: 900; color: #ffffff;
    border-bottom: 4px dashed rgba(255,255,255,.4); padding-bottom: 10px;
  }
  .ph { color: #ffd766; }
  .note {
    position: absolute; bottom: 130px; left: 0; right: 0; text-align: center;
    font-size: 30px; color: #ffffff; opacity: .9; letter-spacing: 1px;
    text-shadow: 0 2px 14px rgba(0,0,0,.9);
  }
  .cta {
    position: absolute; bottom: 0; left: 0; right: 0; height: 110px;
    background: linear-gradient(90deg, #e63946, #8b0000);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 900; letter-spacing: 3px; color: #fff;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div>
    <div class="kicker">UFC 333 · RESULTADOS</div>
    <div class="title">🏆 Y EL GANADOR…</div>
    <div class="panel">
      <div class="row">
        <div class="label">Ganador de la pelea</div>
        <div class="value ph">[ GANADOR ]</div>
      </div>
      <div class="row">
        <div class="label">Cómo ganó</div>
        <div class="value ph">[ MÉTODO ] · ROUND [ R ]</div>
      </div>
      <div class="row">
        <div class="label">Ganador de la rifa</div>
        <div class="value ph">[ FELICITADO ] 🎉</div>
      </div>
    </div>
    <div class="note">⏳ Plantilla — llenar solo con resultados verificados (~17:30 CST)</div>
    <div class="cta">GRACIAS POR PARTICIPAR · NOS VEMOS EN LA PRÓXIMA PELEA</div>
  </div>
</body>
</html>
