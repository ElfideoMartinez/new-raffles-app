<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; }
  .stage {
    position: relative; width: 1080px; height: 1350px;
    background: url('file:///Users/danielmartinez/.openclaw/media/tool-image-generation/p3-bets-bg---645caac4-1683-483e-b783-6d671d39b86c.jpg') center/cover no-repeat;
    font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
  }
  .kicker {
    position: absolute; top: 56px; left: 0; right: 0; text-align: center;
    font-size: 30px; letter-spacing: 10px; color: #f5c542; font-weight: 900;
    text-transform: uppercase; text-shadow: 0 2px 12px rgba(0,0,0,.8);
  }
  .today {
    position: absolute; top: 100px; left: 0; right: 0; text-align: center;
    font-size: 110px; font-weight: 900; letter-spacing: 4px;
    text-shadow: 0 4px 24px rgba(0,0,0,.9);
  }
  .q {
    position: absolute; bottom: 330px; left: 0; right: 0; text-align: center;
    font-size: 84px; font-weight: 900; color: #f5c542; letter-spacing: 2px;
    text-shadow: 0 4px 24px rgba(0,0,0,.95);
  }
  .vs {
    position: absolute; bottom: 200px; left: 0; right: 0; text-align: center;
    font-size: 52px; font-weight: 900; letter-spacing: 3px;
    text-shadow: 0 3px 18px rgba(0,0,0,.95);
  }
  .vs .name { color: #fff; }
  .vs .sep { color: #e63946; padding: 0 18px; font-size: 44px; }
  .cta {
    position: absolute; bottom: 0; left: 0; right: 0; height: 120px;
    background: linear-gradient(90deg, #e63946, #8b0000);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 900; letter-spacing: 2px;
  }
  .cta span { color: #fff; }
  .cta b { color: #ffd766; padding: 0 10px; }
  .bottom-gradient {
    position: absolute; bottom: 120px; left: 0; right: 0; height: 260px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.72) 60%);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="bottom-gradient"></div>
    <div class="kicker">UFC 333 · 24 OCT · HOY</div>
    <div class="today">¡HOY PELEA!</div>
    <div class="q">¿QUIÉN GANA?</div>
    <div class="vs"><span class="name">VOLKANOVSKI</span><span class="sep">VS</span><span class="name">EVLOEV</span></div>
    <div class="cta"><span>ÚLTIMA LLAMADA PARA TU BOLETO</span><b>· LINK EN BIO</b></div>
  </div>
</body>
</html>
